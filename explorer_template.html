<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baby name explorer</title>
<style>
:root {
  color-scheme: light dark;
  --surface: #fcfcfb; --card: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --muted: #75746f;
  --grid: #e7e6e2; --axis: #c9c8c3; --chip: #f1f0ec; --border: #dcdbd6; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1a1a19; --card: #232321; --ink: #f0efec; --ink2: #c3c2b7; --muted: #9a998f;
    --grid: #333330; --axis: #4a4944; --chip: #2d2d2a; --border: #3a3a36; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { font-size: 24px; margin: 0 0 2px; }
h2 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
h3 { font-size: 14px; margin: 14px 0 6px; }
.sub { margin: 0 0 16px; color: var(--ink2); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px; margin-bottom: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.row.small { margin-top: 10px; align-items: center; gap: 12px; }
label { display: block; font-size: 12px; color: var(--ink2); margin-bottom: 4px; }
.search { position: relative; flex: 1 1 260px; min-width: 220px; }
input[type=text], select { width: 100%; font: inherit; font-size: 16px; padding: 8px 10px;
  color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
input[type=text]:focus, select:focus, button:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px; }
#sug { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 4px;
  list-style: none; background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.18); max-height: 320px; overflow: auto; }
#sug li { display: flex; align-items: baseline; gap: 8px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
#sug li[aria-selected=true] { background: var(--chip); }
#sug .nm { font-weight: 600; }
#sug .sx { color: var(--ink2); }
#sug .tt { margin-left: auto; color: var(--muted); font-size: 12px; }
#sug li.none { cursor: default; color: var(--ink2); display: block; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; padding: 8px 12px; border: 0; background: var(--surface);
  color: var(--ink2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed=true] { background: var(--accent); color: #fff; }
.from { width: 96px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; min-height: 34px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 6px 5px 10px;
  background: var(--chip); border: 1px solid var(--border); border-radius: 999px; }
.chip button { border: 0; background: transparent; color: var(--ink2); font-size: 18px; line-height: 1;
  width: 24px; height: 24px; border-radius: 50%; cursor: pointer; }
.chip button:hover { background: var(--border); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
button.link { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px;
  cursor: pointer; padding: 2px 0; }
.note { color: var(--ink2); font-size: 13px; }
.chart { position: relative; }
.chart svg { display: block; font-family: inherit; }
.chart .empty { color: var(--muted); padding: 40px 0; text-align: center; margin: 0; }
.tick { font-size: 11px; fill: var(--muted); }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.endlab { font-size: 12px; fill: var(--ink); }
.nodata { font-size: 12px; fill: var(--muted); }
.xh { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
.hdot { stroke: var(--card); stroke-width: 2; }
.hit { cursor: crosshair; touch-action: pan-y; }
.tip { position: absolute; pointer-events: none; z-index: 3; background: var(--card);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px;
  box-shadow: 0 6px 20px rgba(0,0,0,.18); white-space: nowrap; }
.tip .h { font-weight: 600; margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; line-height: 1.6; }
.tip .k { color: var(--ink2); }
.tip .v { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
details summary { cursor: pointer; font-weight: 600; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; font-size: 13px; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
th:first-child { text-align: left; }
thead th { color: var(--ink2); font-weight: 600; }
tbody th { font-weight: 500; }
td.tot { font-weight: 600; }
footer { color: var(--ink2); font-size: 13px; margin-top: 18px; }
#err { color: #b3261e; }
@media (prefers-color-scheme: dark) { #err { color: #ff8a80; } }
</style>
</head>
<body>
<main>
  <h1>Baby name explorer</h1>
  <p class="sub" id="sub"></p>
  <p id="loading">Loading data&hellip;</p>
  <p id="err" role="alert"></p>

  <section class="card" id="controls" hidden>
    <div class="row">
      <div class="search">
        <label for="q">Add a name</label>
        <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Start typing, e.g. Paulina"
               role="combobox" aria-expanded="false" aria-controls="sug" aria-autocomplete="list">
        <ul id="sug" role="listbox" hidden></ul>
      </div>
      <div>
        <label id="metric-label">Show</label>
        <div class="seg" role="group" aria-labelledby="metric-label">
          <button type="button" data-m="count" aria-pressed="true">Babies</button>
          <button type="button" data-m="rate" aria-pressed="false">Per 100,000 births</button>
        </div>
      </div>
      <div>
        <label id="scale-label">Scale</label>
        <div class="seg" role="group" aria-labelledby="scale-label">
          <button type="button" data-s="linear" aria-pressed="true">Linear</button>
          <button type="button" data-s="log" aria-pressed="false" title="Each gridline is 10 times the one below">Log</button>
        </div>
      </div>
      <div class="from">
        <label for="from">From year</label>
        <select id="from"></select>
      </div>
    </div>
    <div class="chips" id="chips" aria-live="polite"></div>
    <div class="row small">
      <button type="button" class="link" id="reset">Reset to starter names</button>
      <button type="button" class="link" id="clear">Clear all</button>
      <span id="note" class="note" role="status"></span>
    </div>
  </section>

  <section class="card"><h2 id="t-usa"></h2><div class="chart" id="usa"></div></section>
  <section class="card"><h2 id="t-st"></h2><div class="chart" id="st"></div></section>
  <section class="card">
    <details><summary>Show the numbers as tables (babies per decade)</summary><div id="tables"></div></details>
  </section>
  <footer id="foot"></footer>
</main>

<script id="payload" type="text/plain">__PAYLOAD_B64__</script>
<script>
(async function () {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function loadPayload() {
  if (!('DecompressionStream' in window)) throw new Error('this browser lacks DecompressionStream');
  const bin = atob($('#payload').textContent.trim());
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}

let D;
try { D = await loadPayload(); }
catch (e) {
  $('#loading').hidden = true;
  $('#err').textContent = 'Could not load the data: ' + e.message + '. Try a recent Chrome, Edge, Firefox or Safari.';
  return;
}
$('#loading').hidden = true;
$('#controls').hidden = false;

const MAX = 8;
const SEX_LABEL = { F: 'girls', M: 'boys' };
const nameOf = k => k.split('|')[0];
const sexOf = k => k.split('|')[1];
const label = k => nameOf(k) + ' (' + SEX_LABEL[sexOf(k)] + ')';
const TOT = new Map(D.names);
const ALL = D.names.map(x => x[0]);
const NAME_LC = ALL.map(k => nameOf(k).toLowerCase());
const PANELS = [
  { id: 'usa', src: 'usa', title: 'United States', start: D.y0 },
  { id: 'st',  src: 'st',  title: D.stateName,     start: D.stStart },
];

$('#sub').textContent = 'United States and ' + D.stateName + ' · Social Security Administration data, ' + D.y0 + '–' + D.y1;
$('#foot').innerHTML =
  'Source: Social Security Administration national and state baby name files (' + D.y0 + '–' + D.y1 +
  '; state files start in ' + D.stStart + '). A name is left out of an area’s file in a year when fewer than 5 babies ' +
  'had it, so a gap means “under 5,” not zero. “Per 100,000 births” divides by the births of that sex recorded in the same files, ' +
  'which slightly undercounts true births. The log scale puts gridlines at powers of 10, so a very common name and a rare one can share a chart. ' +
  'Sex is as recorded by the SSA. This page includes names with at least ' +
  D.minTotal.toLocaleString() + ' births since ' + D.y0 + '. Everything runs in your browser; no data is sent anywhere.';

// ---------- state ----------
let selected = [];            // [{key, slot}]
let metric = 'count';         // 'count' | 'rate'
let yscale = 'linear';        // 'linear' | 'log'
let fromYear = D.y0;

function freeSlot() {
  const used = new Set(selected.map(s => s.slot));
  for (let i = 1; i <= MAX; i++) if (!used.has(i)) return i;
  return 0;
}
function setNote(t) { $('#note').textContent = t; }
function add(key) {
  if (selected.some(s => s.key === key)) return;
  const slot = freeSlot();
  if (!slot) { setNote('You can compare up to ' + MAX + ' names at once. Remove one first.'); return; }
  selected.push({ key, slot });
  setNote('');
  refresh();
}
function remove(key) { selected = selected.filter(s => s.key !== key); setNote(''); refresh(); }
function defaults() { return D.defaults.filter(k => TOT.has(k)); }
function resetToDefaults() { selected = []; defaults().forEach(add); if (!selected.length) refresh(); }

// ---------- data access ----------
function rawAt(src, key, year) {
  const s = D[src][key];
  if (!s) return null;
  const i = year - s[0];
  if (i < 0 || i >= s[1].length) return null;
  const c = s[1][i];
  return c > 0 ? c : null;
}
function valueAt(src, key, year) {
  const c = rawAt(src, key, year);
  if (c == null) return null;
  if (metric === 'count') return c;
  const tot = D[src === 'usa' ? 'usaTot' : 'stTot'][sexOf(key)][year - D.y0];
  return tot > 0 ? c / tot * 1e5 : null;
}

// ---------- search ----------
let sugItems = [], active = -1;
function search(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const have = new Set(selected.map(s => s.key));
  // Exact name matches first (girls and boys versions), then names starting with it, then names containing it.
  const exact = [], starts = [], contains = [];
  for (let i = 0; i < ALL.length; i++) {
    if (have.has(ALL[i])) continue;
    const lc = NAME_LC[i];
    if (lc === q) exact.push(ALL[i]);
    else if (lc.startsWith(q)) { if (starts.length < 8) starts.push(ALL[i]); }
    else if (q.length >= 2 && contains.length < 8 && lc.includes(q)) contains.push(ALL[i]);
    if (exact.length + starts.length >= 16 && contains.length >= 8) break;
  }
  return exact.concat(starts, contains).slice(0, 8);
}
function renderSug() {
  const q = $('#q').value, ul = $('#sug');
  if (!q.trim()) { ul.hidden = true; $('#q').setAttribute('aria-expanded', 'false'); return; }
  sugItems = search(q);
  active = sugItems.length ? 0 : -1;
  if (!sugItems.length) {
    ul.innerHTML = '<li class="none">No match for “' + esc(q.trim()) + '”. Names with fewer than ' +
      D.minTotal.toLocaleString() + ' births since ' + D.y0 + ' are left out of this page.</li>';
  } else {
    ul.innerHTML = sugItems.map((k, i) =>
      '<li role="option" id="opt' + i + '" data-k="' + esc(k) + '" aria-selected="' + (i === active) + '">' +
      '<span class="nm">' + esc(nameOf(k)) + '</span><span class="sx">' + SEX_LABEL[sexOf(k)] + '</span>' +
      '<span class="tt">' + TOT.get(k).toLocaleString() + ' births</span></li>').join('');
  }
  ul.hidden = false;
  $('#q').setAttribute('aria-expanded', 'true');
}
function setActive(i) {
  if (!sugItems.length) return;
  active = (i + sugItems.length) % sugItems.length;
  document.querySelectorAll('#sug li[role=option]').forEach((li, j) => li.setAttribute('aria-selected', j === active));
  $('#q').setAttribute('aria-activedescendant', 'opt' + active);
}
function pick(key) { add(key); $('#q').value = ''; renderSug(); }
$('#q').addEventListener('input', renderSug);
$('#q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
  else if (e.key === 'Enter') { if (active >= 0 && sugItems[active]) { e.preventDefault(); pick(sugItems[active]); } }
  else if (e.key === 'Escape') { $('#q').value = ''; renderSug(); }
});
$('#q').addEventListener('blur', () => { $('#sug').hidden = true; $('#q').setAttribute('aria-expanded', 'false'); });
$('#q').addEventListener('focus', () => { if ($('#q').value.trim()) renderSug(); });
$('#sug').addEventListener('pointerdown', e => {
  const li = e.target.closest('li[data-k]');
  if (li) { e.preventDefault(); pick(li.dataset.k); }
});

// ---------- controls ----------
document.querySelectorAll('.seg button[data-m]').forEach(b => b.addEventListener('click', () => {
  metric = b.dataset.m; refresh();
}));
document.querySelectorAll('.seg button[data-s]').forEach(b => b.addEventListener('click', () => {
  yscale = b.dataset.s; refresh();
}));
const fromOpts = [1880, 1910, 1950, 1980, 2000].filter(y => y >= D.y0 && y < D.y1);
$('#from').innerHTML = fromOpts.map(y => '<option value="' + y + '">' + y + '</option>').join('');
$('#from').addEventListener('change', e => { fromYear = +e.target.value; refresh(); });
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if (b) remove(b.dataset.k);
});
$('#reset').addEventListener('click', resetToDefaults);
$('#clear').addEventListener('click', () => { selected = []; setNote(''); refresh(); });

// ---------- chart helpers ----------
function niceScale(max) {
  const raw = max / 5, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
  const n = Math.ceil(max / step - 1e-9);
  return { max: n * step, step, ticks: Array.from({ length: n + 1 }, (_, i) => i * step) };
}
function fmtTick(v, step) {
  if (step < 1) return v.toFixed(step < 0.1 ? 2 : 1);
  return Math.round(v).toLocaleString();
}
const endLabel = (key, narrow) => {
  const dup = selected.some(s => s.key !== key && nameOf(s.key) === nameOf(key));
  const t = dup ? label(key) : nameOf(key);
  const cap = narrow ? 11 : 17;
  return t.length > cap ? t.slice(0, cap - 1) + '…' : t;
};

const geo = {};
function renderPanel(p) {
  const el = $('#' + p.id);
  if (!selected.length) { delete geo[p.id]; el.innerHTML = '<p class="empty">Add a name above to see its chart.</p>'; return; }
  const W = Math.max(300, Math.floor(el.clientWidth)), H = W < 520 ? 250 : 310;
  const showLabels = selected.length <= 4;
  const narrow = W < 520;
  const m = { l: narrow ? 46 : 54, r: showLabels ? (narrow ? 76 : 112) : 14, t: 10, b: 26 };
  const x0 = Math.max(fromYear, D.y0), x1 = D.y1;
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const X = y => m.l + (y - x0) / (x1 - x0) * iw;
  const years = []; for (let y = x0; y <= x1; y++) years.push(y);
  const data = selected.map(s => ({ s, pts: years.map(y => valueAt(p.src, s.key, y)) }));
  let max = 0, min = Infinity;
  data.forEach(d => d.pts.forEach(v => { if (v != null) { if (v > max) max = v; if (v < min) min = v; } }));
  let Y, ticks;
  if (yscale === 'log') {
    // Gridlines at powers of 10; every value is positive, so log is safe.
    const e0 = Math.floor(Math.log10(min === Infinity ? 1 : min));
    let e1 = Math.ceil(Math.log10(max || 10));
    if (e1 <= e0) e1 = e0 + 1;
    Y = v => m.t + ih - (Math.log10(v) - e0) / (e1 - e0) * ih;
    ticks = [];
    for (let e = e0; e <= e1; e++) { const v = Math.pow(10, e); ticks.push({ y: Y(v), text: v < 1 ? String(v) : v.toLocaleString() }); }
  } else {
    const sc = niceScale(max || 1);
    Y = v => m.t + ih - v / sc.max * ih;
    ticks = sc.ticks.map(t => ({ y: Y(t), text: fmtTick(t, sc.step) }));
  }
  const aria = p.title + ': ' + (metric === 'count' ? 'babies per year' : 'births per 100,000') + ' for ' + selected.map(s => label(s.key)).join(', ');

  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(aria) + '">';
  if (p.start > x0) {
    const xe = X(Math.min(p.start, x1)), bw = xe - m.l;
    const msg = bw >= 130 ? 'No data before ' + p.start : bw >= 60 ? 'No data' : '';
    svg += '<rect x="' + m.l + '" y="' + m.t + '" width="' + bw + '" height="' + ih + '" fill="var(--chip)" opacity=".7"/>' +
      (msg ? '<text x="' + (m.l + xe) / 2 + '" y="' + (m.t + ih / 2) + '" text-anchor="middle" class="nodata">' + msg + '</text>' : '');
  }
  ticks.forEach((t, i) => {
    svg += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + t.y + '" y2="' + t.y + '" class="' + (i === 0 ? 'axis' : 'grid') + '"/>' +
      '<text x="' + (m.l - 8) + '" y="' + (t.y + 4) + '" text-anchor="end" class="tick">' + t.text + '</text>';
  });
  // Year labels: the smallest step that leaves ~52px between labels, so they never collide.
  const span = x1 - x0, xs = [2, 5, 10, 20, 25, 50, 100].find(s => s * iw / span >= 52) || 100;
  for (let y = Math.ceil(x0 / xs) * xs; y <= x1; y += xs)
    svg += '<text x="' + X(y) + '" y="' + (H - 8) + '" text-anchor="middle" class="tick">' + y + '</text>';

  for (const d of data) {
    let path = '', seg = [], dots = '';
    const flush = () => {
      if (seg.length >= 2) path += 'M' + seg.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('L');
      else if (seg.length === 1) dots += '<circle cx="' + seg[0][0].toFixed(1) + '" cy="' + seg[0][1].toFixed(1) +
        '" r="3.5" style="fill:var(--s' + d.s.slot + ')" class="hdot"/>';
      seg = [];
    };
    d.pts.forEach((v, i) => { if (v == null) flush(); else seg.push([X(x0 + i), Y(v)]); });
    flush();
    svg += '<path d="' + path + '" fill="none" style="stroke:var(--s' + d.s.slot + ')" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' + dots;
  }
  if (showLabels) {
    const labs = data.map(d => {
      let li = -1;
      for (let i = d.pts.length - 1; i >= 0; i--) if (d.pts[i] != null) { li = i; break; }
      return li < 0 ? null : { x: X(x0 + li), y: Y(d.pts[li]), text: endLabel(d.s.key, narrow) };
    }).filter(Boolean).sort((a, b) => a.y - b.y);
    for (let i = 1; i < labs.length; i++) if (labs[i].y - labs[i - 1].y < 13) labs[i].y = labs[i - 1].y + 13;
    for (const L of labs) svg += '<text x="' + (L.x + 7).toFixed(1) + '" y="' + (L.y + 4).toFixed(1) + '" class="endlab">' + esc(L.text) + '</text>';
  }
  svg += '<line id="xh-' + p.id + '" class="xh" y1="' + m.t + '" y2="' + (m.t + ih) + '" visibility="hidden"/>' +
    '<g id="hv-' + p.id + '"></g>' +
    '<rect class="hit" x="' + m.l + '" y="' + m.t + '" width="' + iw + '" height="' + ih + '" fill="transparent"/></svg>' +
    '<div class="tip" id="tip-' + p.id + '" hidden></div>';
  el.innerHTML = svg;
  geo[p.id] = { W, H, m, x0, x1, iw, ih, X, Y };
  const hit = el.querySelector('.hit');
  const move = e => {
    const r = hit.getBoundingClientRect();
    const yr = Math.round(x0 + (e.clientX - r.left) / r.width * (x1 - x0));
    hover(Math.min(x1, Math.max(x0, yr)));
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  // On touch screens the finger "leaves" as soon as it lifts; keep the tooltip until the next tap elsewhere.
  hit.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') hideHover(); });
}
document.addEventListener('pointerdown', e => { if (!e.target.closest('.chart')) hideHover(); });

function hover(year) {
  for (const p of PANELS) {
    const g = geo[p.id];
    if (!g) continue;
    const x = g.X(year);
    const xh = $('#xh-' + p.id);
    xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
    let dots = '', rows = '';
    for (const s of selected) {
      const v = valueAt(p.src, s.key, year), raw = rawAt(p.src, s.key, year);
      if (v != null) dots += '<circle cx="' + x + '" cy="' + g.Y(v) + '" r="4.5" class="hdot" style="fill:var(--s' + s.slot + ')"/>';
      let txt;
      if (year < p.start) txt = 'no data';
      else if (raw == null) txt = 'under 5 (not listed)';
      else if (metric === 'count') txt = raw.toLocaleString() + ' babies';
      else txt = v.toFixed(1) + ' per 100k (' + raw.toLocaleString() + ' babies)';
      rows += '<div class="r"><i class="dot" style="background:var(--s' + s.slot + ')"></i><span class="k">' + esc(label(s.key)) +
        '</span><span class="v">' + txt + '</span></div>';
    }
    $('#hv-' + p.id).innerHTML = dots;
    const tip = $('#tip-' + p.id);
    tip.innerHTML = '<div class="h">' + year + '</div>' + rows;
    tip.hidden = false;
    const tw = tip.offsetWidth;
    let left = x + 14;
    if (left + tw > g.W - 4) left = x - tw - 14;
    tip.style.left = Math.max(4, left) + 'px';
    tip.style.top = (g.m.t + 6) + 'px';
  }
}
function hideHover() {
  for (const p of PANELS) {
    const xh = $('#xh-' + p.id), tip = $('#tip-' + p.id), hv = $('#hv-' + p.id);
    if (xh) xh.setAttribute('visibility', 'hidden');
    if (tip) tip.hidden = true;
    if (hv) hv.innerHTML = '';
  }
}

// ---------- tables ----------
function renderTables() {
  if (!selected.length) { $('#tables').innerHTML = '<p class="note">Add a name to see its numbers.</p>'; return; }
  const decs = [];
  for (let d = Math.floor(D.y0 / 10) * 10; d <= D.y1; d += 10) decs.push(d);
  const mk = p => {
    let h = '<h3>' + esc(p.title) + '</h3><div class="tw"><table><thead><tr><th>Name</th>' +
      decs.map(d => '<th>' + d + 's</th>').join('') + '<th>Total</th></tr></thead><tbody>';
    for (const s of selected) {
      let tot = 0;
      const cells = decs.map(d => {
        if (d + 9 < p.start) return '<td>–</td>';
        let sum = 0, any = false;
        for (let y = Math.max(d, D.y0); y <= Math.min(d + 9, D.y1); y++) {
          const r = rawAt(p.src, s.key, y);
          if (r != null) { sum += r; any = true; }
        }
        tot += sum;
        return '<td>' + (any ? sum.toLocaleString() : '–') + '</td>';
      });
      h += '<tr><th scope="row"><i class="dot" style="background:var(--s' + s.slot + ')"></i> ' + esc(label(s.key)) +
        '</th>' + cells.join('') + '<td class="tot">' + tot.toLocaleString() + '</td></tr>';
    }
    return h + '</tbody></table></div>';
  };
  $('#tables').innerHTML = mk(PANELS[0]) + mk(PANELS[1]) +
    '<p class="note">The last decade covers only through ' + D.y1 + '. A dash means the name was not listed (under 5 births) ' +
    'in any year of that decade. Totals leave out unlisted years, so they can undercount.</p>';
}

// ---------- render everything ----------
function renderChips() {
  $('#chips').innerHTML = selected.map(s =>
    '<span class="chip"><i class="dot" style="background:var(--s' + s.slot + ')"></i>' + esc(label(s.key)) +
    '<button type="button" data-k="' + esc(s.key) + '" aria-label="Remove ' + esc(label(s.key)) + '">×</button></span>').join('');
}
function renderTitles() {
  const unit = (metric === 'count' ? 'babies per year' : 'per 100,000 births of that sex') +
    (yscale === 'log' ? ' · log scale' : '');
  $('#t-usa').textContent = 'United States · ' + unit;
  $('#t-st').textContent = D.stateName + ' · ' + unit;
  document.querySelectorAll('.seg button[data-m]').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === metric));
  document.querySelectorAll('.seg button[data-s]').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === yscale));
}
function saveHash() {
  try {
    const p = new URLSearchParams();
    if (selected.length) p.set('n', selected.map(s => s.key).join(','));
    if (metric !== 'count') p.set('m', metric);
    if (yscale !== 'linear') p.set('y', yscale);
    if (fromYear !== D.y0) p.set('from', fromYear);
    history.replaceState(null, '', '#' + p.toString().replace(/%7C/g, '|').replace(/%2C/g, ','));
  } catch (e) { /* ignore */ }
}
function renderCharts() { PANELS.forEach(renderPanel); }
function refresh() { renderChips(); renderTitles(); renderCharts(); renderTables(); saveHash(); }

// ---------- start ----------
// Read names, metric, scale and start year from the address (#n=...&m=rate&y=log&from=1950).
// Also runs if someone pastes a different link into a tab that is already open.
function applyHash(first) {
  const p = new URLSearchParams(location.hash.slice(1));
  metric = p.get('m') === 'rate' ? 'rate' : 'count';
  yscale = p.get('y') === 'log' ? 'log' : 'linear';
  const f = +p.get('from');
  fromYear = fromOpts.includes(f) ? f : D.y0;
  $('#from').value = String(fromYear);
  const keys = (p.get('n') || '').split(',').filter(k => TOT.has(k));
  selected = [];
  const useKeys = keys.length ? keys.slice(0, MAX) : (first && !p.has('n') ? defaults() : []);
  useKeys.forEach(k => { if (!selected.some(s => s.key === k)) selected.push({ key: k, slot: freeSlot() }); });
  setNote('');
  refresh();
}
applyHash(true);
window.addEventListener('hashchange', () => applyHash(false));

let lastW = 0, raf = 0;
new ResizeObserver(() => {
  const w = $('#usa').clientWidth;
  if (w === lastW) return;
  lastW = w;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(renderCharts);
}).observe($('#usa'));
})();
</script>
</body>
</html>
